name: Deploy to GitHub Pages

# Deployt die statische Seite bei jedem Push auf main automatisch.
on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt manuelles Auslösen über den Actions-Tab

# Berechtigungen, die das offizielle Pages-Deployment braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Kein Build nötig – die ganze Repo-Root (index.html) wird als Artefakt hochgeladen.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
